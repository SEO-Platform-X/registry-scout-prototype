<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>LAIR OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;1,500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column (bottom tab bar, sticky header), centered on desktop.
   A dark "prototype controls" strip above it switches between the 8 LAIR roles, like the Acorn prototype. */
:root{
  --blue:#1F4FE0;--blue-2:#1a43c2;--tint:#E7EDFC;--coral:#FF5A3C;
  --ink:#0B1A2E;--ink-2:#3a4a62;--muted:#6b778a;--faint:#9aa3b2;
  --paper:#F4F1EA;--paper-2:#ECE6D6;--card:#ffffff;--line:#e2dccd;--line-2:#cfc8b6;
  --good:#1f8a4c;--good-soft:#dff2e6;--warn:#a5600a;--warn-soft:#fbefd9;--bad:#c4281c;--bad-soft:#fbe4e1;
  --demo:#0B1A2E;--demo-2:#16263d;--demo-fg:#e8ecf3;--demo-mute:#93a0b5;
  --scrim:rgba(11,26,46,.45);
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --serif:'Cormorant',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#6d8fff;--blue-2:#89a4ff;--tint:#1b2a52;--ink:#eef1f6;--ink-2:#c3cbd8;--muted:#8e9aae;--faint:#5f6b80;
  --paper:#0B1A2E;--paper-2:#122339;--card:#132840;--line:#22385a;--line-2:#2f4a72;
  --good:#4cc782;--good-soft:#123826;--warn:#f0b357;--warn-soft:#3a2c10;--bad:#ff7a6b;--bad-soft:#40181a;
  --demo:#050d18;--demo-2:#0f1d31;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#6d8fff;--blue-2:#89a4ff;--tint:#1b2a52;--ink:#eef1f6;--ink-2:#c3cbd8;--muted:#8e9aae;--faint:#5f6b80;
  --paper:#0B1A2E;--paper-2:#122339;--card:#132840;--line:#22385a;--line-2:#2f4a72;
  --good:#4cc782;--good-soft:#123826;--warn:#f0b357;--warn-soft:#3a2c10;--bad:#ff7a6b;--bad-soft:#40181a;
  --demo:#050d18;--demo-2:#0f1d31;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--demo)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* prototype strip */
.demo{background:var(--demo);color:var(--demo-fg)}
.dw{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:grid;gap:8px}
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--demo-mute)}
.dtag{background:var(--coral);color:#fff;font:700 10.5px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.dtypes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dtypes::-webkit-scrollbar{display:none}
.dt{flex:0 0 auto;display:grid;text-align:left;background:var(--demo-2);border:1px solid #24364f;color:var(--demo-fg);padding:6px 11px 7px;border-radius:10px;line-height:1.25;min-width:118px}
.dt small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--demo-mute);font-weight:600}
.dt b{font-size:13px;font-weight:600;white-space:nowrap}
.dt[aria-pressed="true"]{background:#fff;color:#0B1A2E;border-color:#fff}
.dt[aria-pressed="true"] small{color:#1F4FE0}

/* app column */
.app{max-width:560px;margin:0 auto;min-height:calc(100vh - 120px);background:var(--paper);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{width:26px;height:26px;flex:0 0 auto}
.brand b{font:800 15px var(--display);letter-spacing:-.2px;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 12px var(--display);margin-left:auto;flex:0 0 auto}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 24px;display:grid;gap:22px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none}
.tabs nav{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tb{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;position:relative;border-radius:10px}
.tb svg{width:22px;height:22px}
.tb[aria-current="page"]{color:var(--blue)}
.tb .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;font-weight:700}

/* type */
.hello{font:500 italic 34px/1.05 var(--serif);letter-spacing:-.3px}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.lbl{font:700 11px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl a,.lbl button{font:600 12.5px var(--body);letter-spacing:0;text-transform:none;color:var(--blue);border:0;background:none;padding:0}
.sec{display:grid;gap:10px}
.h1{font:700 24px/1.15 var(--display);letter-spacing:-.4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card.flat{background:transparent}
.card.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.card.blue .muted{color:rgba(255,255,255,.75)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);min-width:0;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
button.li:hover{background:color-mix(in srgb,var(--tint) 50%,transparent)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;font-size:15px;line-height:1.3}
.li .m{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.li .r{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.chev{color:var(--faint);flex:0 0 auto}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:var(--tint);color:var(--blue)}
.ic svg{width:20px;height:20px}
.ic.bad{background:var(--bad-soft);color:var(--bad)}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.good{background:var(--good-soft);color:var(--good)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.stack{display:grid;gap:10px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.blue{background:var(--tint);color:var(--blue)}
.chip.solid{background:var(--ink);color:var(--paper)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font:700 26px/1.1 var(--display);letter-spacing:-.6px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;margin-top:3px;color:var(--ink-2)}
.kpi.good .s{color:var(--good)}.kpi.bad .s{color:var(--bad)}.kpi.warn .s{color:var(--warn)}
.kpi.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}

/* buttons + fields */
.btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;padding:9px 14px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-2)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%;padding:14px;font-size:16px;border-radius:14px}
.btn.big{width:100%;padding:20px;font:800 20px var(--display);border-radius:18px;letter-spacing:-.2px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue);padding-inline:4px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn svg{width:16px;height:16px}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--tint)}
textarea{min-height:110px;resize:vertical;line-height:1.45}
.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.f small{font-weight:400;color:var(--muted)}
.seg{display:flex;background:var(--paper-2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(11,26,46,.12)}

/* meters, bars */
.meter{height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.meter.good i{background:var(--good)}.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13.5px}
.hb .meter{grid-column:1/-1}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;align-items:end;height:110px}
.cols i{display:block;border-radius:5px 5px 2px 2px;background:var(--blue);min-height:3px}
.cols i.f{background:color-mix(in srgb,var(--blue) 30%,transparent)}
.axis{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font:500 10.5px var(--body)}

/* deliverable grid (8 things) */
.eight{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.e8{border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:11px;font-weight:600;line-height:1.2;background:var(--card);display:grid;gap:4px;justify-items:center}
.e8 i{width:10px;height:10px;border-radius:50%;background:var(--paper-2);border:1.5px solid var(--line-2)}
.e8.s1 i{background:var(--warn-soft);border-color:var(--warn)}
.e8.s2 i{background:var(--good);border-color:var(--good)}
.e8.s2{color:var(--ink)}
.e8.s0{color:var(--muted)}

/* access checklist */
.acc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acc div{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;background:var(--card)}
.acc .ok{color:var(--good)}.acc .no{color:var(--bad)}

/* timeline */
.tl{display:grid}
.tl .i{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .i:last-child{border-bottom:0}
.tl .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.tl .k{font:700 10.5px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}

/* map */
.tm{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.tile{aspect-ratio:1;max-width:100%;border:0;border-radius:5px;display:grid;place-items:center;font:700 9.5px var(--display);padding:0;background:var(--paper-2);color:var(--muted)}
.tile.g{background:var(--good);color:#fff}.tile.a{background:#e0a33a;color:#2b1c03}.tile.r{background:var(--bad);color:#fff}
.tile.u{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad)}
.tile.sel{outline:2.5px solid var(--blue);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}

/* storefront preview */
.sf{border-radius:18px;background:var(--ink);color:var(--paper);padding:16px;display:grid;gap:12px}
.sf .muted{color:color-mix(in srgb,var(--paper) 65%,transparent)}
.sf .chip{background:color-mix(in srgb,var(--paper) 14%,transparent);color:var(--paper)}
.sf .chip.good{background:#1d5c3a;color:#bff0d2}
.sf .tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sf .tri div{border:1px solid color-mix(in srgb,var(--paper) 18%,transparent);border-radius:12px;padding:10px;text-align:center}
.sf .tri b{font:700 20px var(--display);display:block}
.logo-sq{width:52px;height:52px;border-radius:14px;background:var(--paper);color:var(--ink);display:grid;place-items:center;font:800 22px var(--display);flex:0 0 auto}

/* sheet + toast */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 2px}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.script{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font:500 italic 22px/1.3 var(--serif)}
.mail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;white-space:pre-wrap;line-height:1.5}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .t{font-weight:600}
.rule .why{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.big-n{font:800 44px/1 var(--display);letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good)}
@media (prefers-reduced-motion:no-preference){.live{animation:pulse 1.6s infinite}@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}}}
.rng{display:grid;gap:4px}
.rng .row{justify-content:space-between;font-size:14px}
.rng input{padding:0;accent-color:var(--blue);border:0;box-shadow:none}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:3px 3px 3px 10px;flex:0 0 auto}
.me:hover{border-color:var(--blue)}
.me .av{margin:0;width:30px;height:30px}
.wamt{display:inline-flex;align-items:center;gap:5px;font:700 13.5px var(--display);color:var(--good);font-variant-numeric:tabular-nums}
.asbar{position:sticky;top:-8px;z-index:3;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 0 0 6px var(--paper)}
.asbar .grow{flex:1;min-width:0}
.msg.sys .b{background:var(--paper-2);color:var(--ink-2)}
.tile.c1{background:color-mix(in srgb,var(--blue) 45%,var(--card));color:#fff}
.tile.c2{background:var(--blue);color:#fff}
.tile sup{font-size:8px;margin-left:1px}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
.pool{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--paper-2)}
.pool i{display:block;height:100%;border-right:2px solid var(--card)}
.pool.over{box-shadow:0 0 0 2px var(--bad)}
.poolrows{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;font-size:13.5px;align-items:center}
.poolrows span:first-child,.poolrows>span:nth-child(3n+1){display:inline-flex;align-items:center;gap:7px}
.offer{background:var(--ink);color:var(--paper);border-radius:18px;padding:16px;display:grid;gap:8px}
.offer .chip{background:color-mix(in srgb,var(--paper) 14%,transparent);color:var(--paper)}
.offer .chip.warn{background:var(--coral);color:#fff}
.offer-h{font:800 26px/1.1 var(--display);letter-spacing:-.5px}
.warnbox{font-size:13.5px;padding:9px 12px;border-radius:10px}
.warnbox.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.warnbox.warn{background:var(--warn-soft);color:var(--warn)}

/* global search + 360 */
.hdr{flex-wrap:wrap}
.qbar{flex:1 1 100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:9px 12px;color:var(--muted);font-size:15px;text-align:left}
.qbar:hover{border-color:var(--blue)}
.qbar svg{width:18px;height:18px;flex:0 0 auto}
.sh.full{height:96vh;max-height:96vh;align-content:start}
.qin{position:sticky;top:-8px;z-index:2;background:var(--paper);padding-block:6px}
.qgrp{font:700 11px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 2px 6px}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.pipe div{display:grid;gap:5px;font-size:10.5px;font-weight:600;color:var(--faint);line-height:1.15}
.pipe i{height:6px;border-radius:9px;background:var(--paper-2)}
.pipe .on{color:var(--ink-2)}.pipe .on i{background:var(--blue)}
.pipe .cur{color:var(--blue)}.pipe .cur i{background:var(--blue);box-shadow:0 0 0 3px var(--tint)}
.clocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.clock{border-radius:16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);min-width:0}
.clock .n{font:800 30px/1 var(--display);letter-spacing:-1px;font-variant-numeric:tabular-nums;margin-top:6px}
.clock .n small{font:600 13px var(--body);letter-spacing:0;color:var(--muted)}
.clock .w{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.clock.bad{background:var(--bad-soft);border-color:transparent}.clock.bad .n{color:var(--bad)}
.clock.warn{background:var(--warn-soft);border-color:transparent}.clock.warn .n{color:var(--warn)}
.clock.good .n{color:var(--good)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:14px}
.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}
.msg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.msg:last-child{border-bottom:0}
.msg .b{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--tint);color:var(--blue)}
.msg .b svg{width:16px;height:16px}
.msg.in .b{background:var(--good-soft);color:var(--good)}
.msg .h{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.person{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .av{margin:0;width:38px;height:38px;background:var(--ink);color:var(--paper)}
.tip{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14.5px;padding:7px 0}
.tip b{color:var(--blue);font:800 14px var(--display)}
.obj{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.obj:last-child{border-bottom:0}
.obj q{font-weight:600;quotes:none}
</style>

const RULES=[
 {k:'t2m',t:'First talk → 1st meeting booked',unit:'days',g:2,a:5,why:'Every day of wait drops show rate. Book it on the first call.'},
 {k:'mtgOut',t:'Meeting held within',unit:'days of booking',g:5,a:10,why:'A meeting 2 weeks out converts about half as often as one this week.'},
 {k:'show',t:'Show rate',unit:'%',g:75,a:65,hi:true,why:'Below 65% means reminders or the booking script need work.'},
 {k:'claimRate',t:'Visits that claim',unit:'%',g:12,a:8,hi:true,why:'Under 8% means the walk-in opener isn\'t landing.'}];
function grade(rule,v){if(rule.hi)return v>=rule.g?'good':v>=rule.a?'warn':'bad';return v<=rule.g?'good':v<=rule.a?'warn':'bad'}
function repVal(r,k){return k==='claimRate'?Math.round(r.claims/r.visits*1000)/10:r[k]}
function teamVal(k){const rs=db.reps;if(k==='claimRate'){return Math.round(rs.reduce((s,r)=>s+r.claims,0)/rs.reduce((s,r)=>s+r.visits,0)*1000)/10}return Math.round(rs.reduce((s,r)=>s+r[k],0)/rs.length*10)/10}
function dealFlags(d){const f=[];const b=d.meet?ago(d.first,d.meet):null;
 if(!d.rep)f.push(['No rep in this state','bad']);
 if(b!=null&&b>10)f.push([`1st meeting ${b} days after first talk`,'bad']);else if(b!=null&&b>5)f.push([`1st meeting ${b} days out`,'warn']);
 if(d.stage==='Proposal'&&ago(d.last)>=7)f.push([`Proposal silent ${ago(d.last)} days`,'bad']);
 if(d.stage==='New claim'&&ago(d.first)>3)f.push([`Claimed ${ago(d.first)} days ago, no contact`,'bad']);
 return f;}

const POOL=30,REPMAX=15,PARTMAX=15;
const PLANS=[[500,'Fix'],[1500,'Trust'],[3000,'Authority']];
const KINDS=[['firstpct','% off first months'],['life','% off for life'],['free','Free month + minimum'],['bonus','Free add-on']];
function pool(d,partnerPct=0,custLife=0){
 const plan=d.plan||1500,annual=plan*12;let disc=0;
 if(d.kind==='firstpct')disc=plan*d.amt/100*d.months;
 else if(d.kind==='life')disc=plan*d.amt/100*12;
 else if(d.kind==='free')disc=plan*d.months;
 else if(d.kind==='bonus')disc=d.amt;
 disc+=plan*custLife/100*12;
 const dP=disc/annual*100,used=dP+partnerPct,reps=Math.max(0,Math.min(REPMAX,POOL-used)),kept=Math.max(0,POOL-used-reps);
 return {plan,annual,disc,dP,pp:partnerPct,used,reps,step:reps/3,kept,over:used>POOL+1e-9};}
const pf=v=>(Math.round(v*10)/10)+'%';
function poolBar(p){
 const seg=(v,c)=>v>0.01?`<i style="width:${Math.min(v,POOL)/POOL*100}%;background:${c}"></i>`:'';
 const rows=[['Customer discount',p.dP,'var(--blue)'],['Partner',p.pp,'var(--coral)'],['Rep: intro',p.step,'var(--good)'],['Rep: booking',p.step,'color-mix(in srgb,var(--good) 65%,var(--card))'],['Rep: close',p.step,'color-mix(in srgb,var(--good) 38%,var(--card))'],['Kept by LAIR',p.kept,'var(--line-2)']];
 return `<div class="pool ${p.over?'over':''}" role="img" aria-label="30% pool split">${rows.map(r=>seg(r[1],r[2])).join('')}</div>
 <div class="poolrows">${rows.filter(r=>r[1]>0.01||r[0].startsWith('Rep')).map(r=>`<span><i class="sw" style="background:${r[2]}"></i>${r[0]}</span><b class="num">${pf(r[1])}</b><span class="num muted">${$(p.annual*r[1]/100)}</span>`).join('')}</div>`;}
function hookText(d){
 const m=d.months>1?`${d.months} months`:'month';
 return d.kind==='firstpct'?(d.amt>=100?`Your first ${m} free`:`${d.amt}% off your first ${m}`):d.kind==='life'?`${d.amt}% off, for as long as you stay`:d.kind==='free'?`First ${m} free with a ${d.min}-month plan`:`Free press release (${$(d.amt)} value) when you start`;}
function dealOut(){
 const d=S.dl,pc=db.pcodes.find(x=>x.code===d.partner),p=pool(d,pc?pc.pct:0,pc?pc.cust:0);
 const base=pool({kind:'firstpct',amt:0,months:1,plan:d.plan});
 const freeBad=d.kind==='free'&&d.min<6;
 const cut=d.closer==='self'?p.step:0,cutBase=d.closer==='self'?base.step:0;
 const planN=PLANS.find(x=>x[0]===d.plan)[1];
 return `<div class="offer"><div class="row sp"><span class="chip blue">${d.for==='Everyone'?'Public offer':'Just for '+esc(d.for)}</span><span class="chip warn">Ends in ${d.exp} day${d.exp>1?'s':''}</span></div>
  <div class="offer-h">${esc(hookText(d))}</div><div class="small">${planN} plan, normally ${$(d.plan)}/mo.${d.cap>1&&d.for==='Everyone'?` Only ${d.cap} spots.`:''}${pc?` Code ${pc.code}.`:''}</div></div>
 <div class="card stack"><div class="row sp"><b>The 30% pool</b><span class="small muted">first-year value ${$(p.annual)}</span></div>${poolBar(p)}
  ${p.over?`<div class="warnbox bad">Over the 30% cap by ${pf(p.used-POOL)}. Lower the discount${pc?' or drop the partner code':''}.</div>`:''}
  ${freeBad?`<div class="warnbox bad">A free month needs at least a 6-month minimum.</div>`:''}
  ${!p.over&&p.reps<REPMAX?`<div class="warnbox warn">This deal takes ${pf(REPMAX-p.reps)} from the sales team. Each rep step drops from 5% to ${pf(p.step)}.</div>`:''}</div>
 <div class="kpis"><div class="kpi ${cut<cutBase?'warn':'good'}"><div class="l">${d.closer==='self'?'Your cut as closer':'Closer\'s cut'}</div><div class="v">${$(p.annual*p.step/100)}</div><div class="s">${pf(p.step)} · was ${$(p.annual*base.step/100)} at 5%</div></div><div class="kpi"><div class="l">Customer saves</div><div class="v">${$(p.disc)}</div><div class="s">over the first year</div></div></div>`;}

  search:()=>{open('search','');setTimeout(()=>document.getElementById('q')?.focus(),40)},
  p360:()=>{S.msgf='all';open('p360',id);const s=document.querySelector('.sh');if(s)s.scrollTop=0},
  close:()=>close(),ovc:()=>close()};
 go[a]&&go[a]();
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.ch==='dlfor'){S.dl.for=el.value;render()}if(el.dataset.ch==='dlpc'){S.dl.partner=el.value;dealUpdate()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='q'){document.getElementById('qres').innerHTML=searchRes(el.value);return}
 if(el.dataset.in==='dl'){const k=el.dataset.id;S.dl[k]=+el.value;const lb=document.getElementById('dlv-'+k);if(lb)lb.textContent=k==='amt'?(S.dl.kind==='bonus'?$(S.dl[k]):S.dl[k]+'%'):S.dl[k];dealUpdate();return}
 if(el.dataset.in==='pc'){const k=el.dataset.id;S.pc[k]=+el.value;document.getElementById('pcv-'+k).textContent=S.pc[k]+'%';document.getElementById('pcOut').innerHTML=poolBar(pool({kind:'firstpct',amt:0,months:1,plan:1500},S.pc.pct,S.pc.cust));return}
 if(el.dataset.in==='pr'){S.prRefs=+el.value;document.getElementById('prv').textContent=S.prRefs;document.getElementById('prOut').textContent=$(partnerCalc(S.prRefs));return}if(el.dataset.in==='fc'){S.fc[el.dataset.id]=+el.value;const k=el.dataset.id,f=S.fc[k];document.getElementById('fv-'+k).textContent=k==='plan'?$(f):['claim','paid','churn'].includes(k)?f+'%':f;godUpdate()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)close();if(e.key==='/'&&!S.sheet&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();open('search','');setTimeout(()=>document.getElementById('q')?.focus(),40)}});
const h0=(location.hash||'').slice(1);if(ROLES.some(r=>r.id===h0))S.role=h0;
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ROLES.some(r=>r.id===h)&&h!==S.role){S.role=h;S.detail=null;render()}});
render();
</script>
