<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Registry Scout prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Cormorant:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1F4FE0; --ink:#0B1A2E; --paper:#F4F1EA; --coral:#FF5A3C;
  --card:#FBFAF6; --line:#DDD7C9; --mute:#55627A; --tint:#E4EAFB; --map:#E6E1D3;
  --s-bg:#E7E2D6; --s-fg:#0B1A2E; --s-mute:#4A566B; --s-card:#F4F1EA; --s-line:#CFC9BA;
  --sbh:50px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--s-bg:#070C14;--s-fg:#EEF0F4;--s-mute:#9AA6BA;--s-card:#101A2B;--s-line:#22304A}
}
:root[data-theme="dark"]{--s-bg:#070C14;--s-fg:#EEF0F4;--s-mute:#9AA6BA;--s-card:#101A2B;--s-line:#22304A}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--s-bg);color:var(--s-fg);font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.topbar{display:none;align-items:center;justify-content:space-between;padding:6px 14px;height:48px;flex:none}
.topbar b{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px}
.pill{min-height:40px;padding:0 16px;border-radius:20px;background:var(--s-card);border:1px solid var(--s-line);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14px;color:var(--s-fg)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.rail{width:300px;flex:none}
.rail h1{font-family:'Cormorant',serif;font-weight:600;font-size:40px;line-height:1.05;margin:0 0 8px}
.rail p{margin:0 0 18px;color:var(--s-mute);font-size:15px;line-height:1.5}
.chap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{display:flex;gap:12px;align-items:center;width:100%;min-height:42px;padding:4px 12px;border-radius:12px;font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:15px;color:var(--s-fg)}
.chap button:hover{background:var(--s-card)}
.chap button[aria-current="true"]{background:var(--s-card);box-shadow:inset 3px 0 0 var(--blue);font-weight:700}
.chap i{font-style:normal;width:22px;color:var(--s-mute);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--s-mute);line-height:1.5;margin-top:16px}

.device{position:relative;flex:none}
.hw{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#6f6d69,#c9c7c2)}
.hw-a{left:-8px;top:118px;height:30px}
.hw-v1{left:-8px;top:170px;height:54px}
.hw-v2{left:-8px;top:236px;height:54px}
.hw-p{right:-8px;top:200px;height:88px;background:linear-gradient(270deg,#6f6d69,#c9c7c2)}
.phone{position:relative;flex:none;container-type:size;width:390px;height:min(844px,calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));border:11px solid #050B14;border-radius:56px;overflow:hidden;background:var(--paper);color:var(--ink);box-shadow:0 0 0 2px #77756f,0 0 0 5px #cfcdc7,0 0 0 6px #8f8d88,0 40px 90px rgba(0,0,0,.4)}
.sb{position:absolute;top:0;left:0;right:0;height:var(--sbh);display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;z-index:6;pointer-events:none;color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:16px}
.sb-r{display:flex;align-items:center;gap:6px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:33px;border-radius:20px;background:#000;z-index:7;pointer-events:none}
.hb{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:6;pointer-events:none}
.phone.dk .sb{color:#fff}
.phone.dk .hb{background:#fff}
@media (max-width:900px){
  :root{--sbh:0px}
  .rail{display:none}
  .topbar{display:flex}
  .stage{padding:0;gap:0;align-items:stretch}
  .device{width:100%;height:100%}
  .hw,.sb,.island,.hb{display:none}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}
.sheet-back{position:fixed;inset:0;background:rgba(5,11,20,.5);display:none;z-index:20}
.sheet-back.open{display:flex;align-items:flex-end}
.sheet{background:var(--s-card);color:var(--s-fg);width:100%;border-radius:20px 20px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:'Cormorant',serif;font-size:28px;margin:0 8px 8px}

/* shell: one screen, never scrolls */
.host{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(var(--sbh) + 8px) 22px 0;animation:fade .2s ease}
.scr.dark{background:var(--ink);color:var(--paper)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scr{animation:none}.pulse,.spin{animation:none!important}}
.top{flex:none;display:flex;align-items:center;gap:10px;min-height:44px}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px}
.bot{flex:none;padding:12px 0 26px;display:flex;flex-direction:column;gap:6px}
@supports (height:1cqh){
  .scr{padding-top:calc(var(--sbh) + clamp(4px,1cqh,12px))}
  .mid{gap:clamp(8px,2cqh,20px)}
  .bot{padding-bottom:clamp(22px,3cqh,30px)}
}

.t1{font-family:'Cormorant',serif;font-weight:600;font-size:34px;line-height:1.04;letter-spacing:-.01em;margin:0}
.t2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;margin:0}
.lbl{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14px;color:var(--mute)}
.p{font-size:16px;line-height:1.45;margin:0}
.mute{color:var(--mute)}
.money{font-family:'Cormorant',serif;font-weight:700;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.bf{font-family:'Bricolage Grotesque',sans-serif}
@supports (height:1cqh){
  .t1{font-size:clamp(26px,4.9cqh,42px)}
  .p{font-size:clamp(14px,2.1cqh,18px)}
}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;width:100%;padding:0 20px;border-radius:16px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:18px;text-align:center}
.btn-blue{background:var(--blue);color:#fff}
.btn-paper{background:var(--paper);color:var(--ink)}
.btn-line{border:1.5px solid var(--ink);color:var(--ink)}
.btn-text{min-height:44px;font-size:16px;color:var(--mute)}
.btn[disabled]{opacity:.45}
@supports (height:1cqh){.btn{min-height:clamp(50px,7.2cqh,62px)}}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;margin-left:-10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--coral);flex:none}
.dot-ok{background:var(--blue)}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--blue)}
.sample{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:12px;padding:4px 10px;border-radius:12px;background:var(--tint);color:var(--blue)}
.tag{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:12px;padding:4px 10px;border-radius:12px;background:var(--tint);color:var(--blue);white-space:nowrap}
.tag.warn{background:#FFE3DC;color:#8A2410}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:14px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:11px;color:var(--mute);text-align:center}
.tab[aria-current="page"]{color:var(--blue)}
.badge{position:absolute;top:6px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* app store */
.appicon{width:92px;height:92px;border-radius:21px;background:var(--blue);display:grid;place-items:center;flex:none;color:#fff}
.get{min-height:38px;min-width:88px;padding:0 22px;border-radius:19px;background:var(--blue);color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;text-align:center}
.prog{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p,0)*1%),var(--line) 0);display:grid;place-items:center}
.prog::after{content:"";width:29px;height:29px;border-radius:50%;background:var(--paper)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}
.facts div{padding:8px 2px;text-align:center;font-size:11px;color:var(--mute);border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:14px;color:var(--ink);margin-top:2px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{border-radius:16px;padding:12px 10px;height:clamp(110px,17cqh,170px);display:flex;flex-direction:column;justify-content:space-between}
.shot p{font-family:'Cormorant',serif;font-weight:600;font-size:18px;line-height:1.08;margin:0}
.num{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:14px;flex:none}

/* onboarding */
.cbars{display:flex;align-items:flex-end;gap:22px;height:clamp(120px,24cqh,220px);padding:0 10px}
.cbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;height:100%;text-align:center}
.cbar i{display:block;border-radius:10px 10px 4px 4px;background:var(--blue)}
.cbar b{font-family:'Cormorant',serif;font-size:36px;line-height:1}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.35}
.msg.q{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;position:relative}
.stamp{display:inline-block;margin-top:8px;border:3px solid var(--coral);color:#C8341A;border-radius:8px;padding:2px 10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;transform:rotate(-6deg);letter-spacing:.04em}
.leg3{display:flex;flex-direction:column;gap:10px}
.leg3 .r{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .f{display:flex;align-items:center;justify-content:space-between;border-radius:12px;padding:12px 16px;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:16px}
.funnel .f b{font-family:'Cormorant',serif;font-size:26px}
.idcard{border:2px dashed var(--ink);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;background:var(--card)}
.opt{width:100%;min-height:64px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--ink);background:var(--card);font-size:17px;line-height:1.3;font-weight:500}
.lic{background:var(--ink);color:var(--paper);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid #22304A}
.lic .av2{width:64px;height:64px;border-radius:14px;background:var(--blue);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:24px}

/* board */
.inkcard{background:var(--ink);color:var(--paper);border-radius:18px;padding:12px 14px}
.us{width:100%;display:block;height:clamp(100px,17cqh,180px)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.tick{font-size:14px;line-height:1.3;display:flex;justify-content:space-between;gap:10px;min-height:20px}
.tick b{font-family:'Bricolage Grotesque',sans-serif;white-space:nowrap}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:44px;border-radius:10px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(11,26,46,.15)}
.seg button[disabled]{opacity:.5}
.lb{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line)}
.rk{width:20px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;color:var(--mute)}
.av{width:38px;height:38px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13px;color:var(--blue);flex:none}

/* find + flow */
.mapbox{border-radius:18px;overflow:hidden;background:var(--map)}
.mapbox svg{display:block;width:100%;height:clamp(110px,23cqh,230px)}
.bigpin{width:104px;height:104px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 auto}
.say-q{background:var(--ink);color:var(--paper);border-radius:20px;padding:22px}
.say-q p{font-family:'Cormorant',serif;font-weight:600;font-size:28px;line-height:1.15;margin:0}
.say-q.sm{padding:16px 18px}
.say-q.sm p{font-size:24px}
@supports (height:1cqh){.say-q.sm p{font-size:clamp(19px,3.3cqh,28px)}}
@supports (height:1cqh){.say-q p{font-size:clamp(23px,4.3cqh,35px)}}
.fact{display:flex;gap:14px;align-items:flex-start;font-size:19px;line-height:1.3;font-weight:500}
.fact .dot{margin-top:7px}
.sl input[type=range]{width:100%;height:48px;margin:0;accent-color:var(--blue)}
.plan{width:100%;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;border:1.5px solid var(--ink);background:var(--card);min-height:70px}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.qr{width:clamp(150px,30cqh,250px);height:auto;margin:0 auto;display:block;background:#fff;padding:12px;border-radius:16px;border:1px solid var(--line)}

/* leads */
.ld{display:flex;gap:12px;width:100%;min-height:72px;border-bottom:1px solid var(--line);align-items:center}
.tl{display:flex;flex-direction:column}
.ti{display:flex;gap:14px;position:relative;padding-bottom:clamp(8px,1.8cqh,16px)}
.ti:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:-2px;width:2px;background:var(--line)}
.tdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--paper);flex:none;z-index:1;color:#fff}
.tdot.done{background:var(--blue);border-color:var(--blue)}
.tdot.now{border-color:var(--blue)}

/* messages */
.th{display:flex;gap:12px;width:100%;min-height:72px;border-bottom:1px solid var(--line);align-items:center}
.bubs{display:flex;flex-direction:column;gap:8px;justify-content:flex-end;min-height:0;overflow:hidden}
.bub{max-width:84%;padding:12px 16px;border-radius:20px;font-size:17px;line-height:1.35}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.meta{font-size:13px;color:var(--mute);margin:0 4px}
.meta.me{align-self:flex-end}
.reply{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--blue);color:var(--blue);background:var(--card);font-size:16px;line-height:1.3;font-weight:500}

.rlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rrow{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line)}
.rrow.you{background:var(--tint);border-radius:12px;padding:0 8px;border-bottom:0}
.youbar{flex:none;display:flex;align-items:center;gap:12px;min-height:54px;background:var(--ink);color:var(--paper);border-radius:14px;padding:0 14px}
.lvl{width:100%;flex:none;display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-radius:14px;background:var(--tint)}
.lvlbar{height:8px;border-radius:4px;background:#fff;overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--blue)}
.mid.board .us{height:clamp(70px,11cqh,140px)}
.frow{display:flex;align-items:center;gap:10px;min-height:34px;font-size:15px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.fic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex:none;line-height:1}
.fic.y{background:var(--blue)}
.fic.n{background:var(--coral);color:var(--ink)}
.fic.q{border:2px solid var(--mute);color:var(--mute);font-size:12px}
.prz{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.prz.cur{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:18px;border-radius:4px;background:var(--line)}
.segs i.on{background:var(--blue)}
.check{display:flex;gap:12px;align-items:flex-start;min-height:44px}
.check input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.field{display:block;width:100%;min-height:60px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:20px;color:var(--ink)}
.field.sm{min-height:54px;font-size:18px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--tint);border-radius:14px;padding:12px 8px;text-align:center}
.stat3 b{display:block;font-family:'Cormorant',serif;font-size:36px;line-height:1}
.stat3 span{font-size:12px;color:var(--mute)}
.ps{aspect-ratio:9/19;border-radius:14px;padding:9px 7px 7px;display:flex;flex-direction:column;gap:7px;overflow:hidden;min-width:0}
.ps-h{font-family:'Cormorant',serif;font-weight:700;font-size:15px;line-height:1.04}
.ps-ui{flex:1;min-height:0;background:var(--paper);color:var(--ink);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:5px;font-size:8px;line-height:1.2;overflow:hidden}
.ps-fn{font-size:7px;opacity:.85;text-align:center}
.m-lbl{color:var(--mute)}
.m-big{font-family:'Cormorant',serif;font-weight:700;font-size:22px;line-height:1;color:var(--blue)}
.m-pill{background:var(--blue);color:#fff;border-radius:8px;padding:4px 5px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;text-align:center}
.m-say{background:var(--ink);color:var(--paper);border-radius:7px;padding:5px;font-family:'Cormorant',serif;font-weight:600;font-size:10px;line-height:1.1}

  '<div class="inkcard" style="padding:20px"><div class="lbl" style="color:#9FB0CC">AI could bring them about</div><div class="money" style="font-size:clamp(44px,7.4cqh,60px);line-height:1.05" id="o-win">'+usd(winMonthly())+'</div><div style="font-size:15px;color:#C9D3E4">a month</div></div><p class="mute" style="font-size:13px;margin:0">An estimate, not a promise. Search volume is pulled live for their website. 3% book and 10% are won.</p></div><div class="bot"><button class="btn btn-blue" data-act="go" data-arg="dplan">Next</button></div></div>';
 }
 if(id==='dplan'){
  var btns=PLANS.map(function(p,i){var m=months(p.p);return '<button class="plan" data-act="pickplan" data-arg="'+i+'"><div class="grow"><b class="bf" style="font-size:19px">'+p.n+'</b><div class="mute" style="font-size:14px">'+(m?'Pays for itself in '+m:'Needs more than '+usd(p.p)+' a month in wins')+'</div></div><div style="text-align:right"><div class="money" style="font-size:26px">'+usd(p.p)+'</div><div class="mute" style="font-size:12px">'+(p.s||'a month')+'</div></div></button>';}).join('');
  return '<div class="scr">'+flowTop()+'<div class="mid" style="gap:10px"><h1 class="t1">Pick one</h1>'+btns+'<p class="mute" style="font-size:13px;margin:0">Month to month. No contract. Sample plans and prices.</p></div></div>';
 }
 return '<div class="scr">'+flowTop()+'<div class="mid"><h1 class="t1">Say this</h1><div class="say-q"><p>"When do you want to start?"</p></div><p class="p mute">'+plan().n+', '+usd(plan().p*0.95)+' a month with your code.</p></div><div class="bot"><button class="btn btn-blue" data-act="go" data-arg="dsend">Send the payment link</button><button class="btn btn-text" data-act="go" data-arg="followup">They need time</button></div></div>';
}
function scDsend(){
 return '<div class="scr">'+flowTop('dclose')+'<div class="mid" style="text-align:center"><div class="spin" aria-hidden="true"></div><h1 class="t1">Waiting for them to pay</h1><p class="p mute">The app marks them a customer when the payment clears.</p></div><div class="bot"><button class="btn btn-blue" data-act="paid">Prototype: they paid</button></div></div>';
}
function scFollowup(){
 var rows=[['Today','Recap text with their audit page'],['Day 2','Email with plan options'],['Day 5','Reminder text'],['Day 9','Offer to answer questions']].map(function(r){return '<div class="row card" style="padding:12px 16px"><b class="bf" style="width:56px">'+r[0]+'</b><span class="p" style="font-size:15px">'+r[1]+'</span></div>';}).join('');
 return '<div class="scr">'+flowTop('dclose')+'<div class="mid" style="gap:10px"><h1 class="t1">We follow up for you</h1>'+rows+'<p class="mute" style="font-size:13px;margin:0">You do not have to remember. You earn when they pay.</p></div><div class="bot"><button class="btn btn-blue" data-act="paid">Prototype: they paid</button></div></div>';
}
function scWon(){
 var l=lead(S.lead)||lead('marlow')||{name:'Marlow Med Spa',plan:S.plan,stage:4,closer:'me'},c=custCount(),li=levelOf(c),L=LEVELS[li],N=LEVELS[li+1];
 var lvl='<div class="card" style="background:#13233A;border-color:#22304A;color:var(--paper)"><b class="bf">Level '+(li+1)+': '+L.n+'</b><div style="font-size:14px;color:#C9D3E4">'+(L.need?L.prize+' on the way. ':'')+(N?(N.need-c)+' more customer'+(N.need-c>1?'s':'')+' to win '+lcFirst(N.prize)+'.':'')+'</div></div>';
 return '<div class="scr dark"><div class="top"></div><div class="mid" style="gap:10px"><div class="lbl" style="color:#9FB0CC">'+l.name+' is a customer</div><h1 class="t1" style="font-size:clamp(30px,5.4cqh,44px)">You earn</h1><div class="money" style="font-size:clamp(56px,9.5cqh,84px);line-height:1">+'+usd(earn(l))+'</div><p class="p" style="color:#C9D3E4">every month while they stay. You found it, booked it and closed it.</p>'+lvl+'</div><div class="bot"><button class="btn btn-paper" data-act="tab" data-arg="money">See my money</button><button class="btn btn-text" style="color:#9FB0CC" data-act="toast" data-arg="Win badge saved. Share it anywhere.">Share my win</button><button class="btn btn-text" style="color:#9FB0CC" data-act="tab" data-arg="find">Find the next business</button></div></div>';
}
function proj(){
 var closes=S.weekly*4*4.33*0.01,nm=closes*PLANS[1].p*0.95*0.05*3,m=0;
 for(var i=0;i<6;i++)m=m*0.95+nm;
 return m;
}
function scMoney(){
 var total=S.leads.reduce(function(a,l){return a+earn(l);},0);
 var cust=S.leads.filter(function(l){return l.stage===4;}),open=S.leads.filter(function(l){return l.stage<4;});
 var wait=open.reduce(function(a,l){return a+potential(l);},0);
 var rows=cust.slice(0,2).map(function(l){return '<div class="row card" style="padding:10px 14px"><span class="av" aria-hidden="true">'+l.name[0]+'</span><div class="grow"><b class="bf">'+l.name+'</b><div class="row" style="gap:6px;margin-top:3px">'+(l.inbound?'':'<span class="tag">Claim</span>')+'<span class="tag">Meeting</span>'+(l.closer==='me'?'<span class="tag">Close</span>':'')+'</div></div><b class="money" style="font-size:22px">'+usd(earn(l))+'</b></div>';}).join('');
 return '<div class="scr"><div class="mid" style="justify-content:flex-start;gap:clamp(8px,1.8cqh,14px);padding-top:6px"><div class="inkcard" style="padding:18px"><div class="lbl" style="color:#9FB0CC">Every month</div><div class="money" style="font-size:clamp(46px,8cqh,64px);line-height:1.05">'+usd(total)+'</div><div style="font-size:14px;color:#C9D3E4">'+(cust.length?cust.length+' customer'+(cust.length>1?'s':'')+'. Paid monthly after they pay.':'Close your first customer to start.')+(open.length?' '+usd(wait)+' more if your '+open.length+' open lead'+(open.length>1?'s':'')+' close.':'')+'</div></div>'+rows+
 '<div class="card"><label class="sl"><span class="row between"><span class="p" style="font-size:15px">Hours you have each week</span><b id="o-weekly" class="bf" style="font-size:20px">'+S.weekly+' hr</b></span><input type="range" min="0" max="10" step="1" value="'+S.weekly+'" data-in="weekly" aria-label="Hours you have each week"></label><div class="row between"><span class="mute" style="font-size:14px">After 6 months</span><b class="money" style="font-size:24px" id="o-proj">'+usd(proj())+' a month</b></div><p class="mute" style="font-size:12px;margin:4px 0 0">An illustration, not a promise.</p></div></div></div>'+tabbar();
}
function scInbox(){
 var list=S.threads.filter(function(t){return !t.done;}).sort(function(a,b){return (b.owe?1:0)-(a.owe?1:0);});
 var hot=S.leads.filter(isHot)[0];
 var alertCard=hot?'<button class="card row" data-act="hotlead" data-arg="'+hot.id+'" style="width:100%;background:var(--tint);border-color:transparent;margin-bottom:6px"><span class="dot dot-ok"></span><div class="grow"><b class="bf">'+esc(hot.contact?hot.contact.name:hot.name)+' is looking at your '+(hot.open.kind==='email'?'email':'link')+'</b><div class="mute" style="font-size:13px">'+openLine(hot)+'. Good time to reach out.</div></div></button>':'';
 var rows=list.map(function(t){var l=t.msgs[t.msgs.length-1];return '<button class="th" data-act="thread" data-arg="'+t.id+'" style="min-height:84px"><span class="av" aria-hidden="true">'+(t.team?'#':t.name[0])+'</span><div class="grow"><b class="bf" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+t.name+'</b><div style="margin:2px 0">'+tstat(t)+'</div><div class="mute" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(l[1])+'</div></div>'+(t.unread?'<span class="dot"></span>':'')+'</button>';}).join('');
 var body=list.length?alertCard+rows+'<p class="mute" style="font-size:13px;margin:12px 0 0">The app messages your leads for you, from a number it gives you, not your own. You see when they open or click.</p>':'<p class="p mute" style="text-align:center">No messages yet. When a business claims its page, the app texts them to book a meeting.</p>';
 return '<div class="scr"><div class="top"><h1 class="t1" style="font-size:32px">Messages</h1></div><div class="mid" style="justify-content:'+(list.length?'flex-start':'center')+';gap:0;padding-top:8px;overflow-y:auto">'+body+'</div></div>'+tabbar();
}
function scThread(){
 var t=thread(S.thread);if(!t)return scInbox();
 var msgs=t.msgs.slice(-3).map(function(m){return '<div class="bub '+m[0]+'">'+esc(m[1])+'</div>'+(m[2]?'<div class="meta '+m[0]+'">'+esc(m[2])+'</div>':'');}).join('');
 var sug=t.sug.length?t.sug.map(function(s,i){return '<button class="reply" data-act="sendreply" data-arg="'+i+'">'+esc(s)+'</button>';}).join(''):(t.auto?'<p class="mute" style="font-size:14px;margin:0;text-align:center">'+t.auto+'</p>':'');
 return '<div class="scr"><div class="top"><button class="iconbtn" data-act="tab" data-arg="inbox" aria-label="Back to messages">'+ic('back',26)+'</button><div><b class="bf" style="font-size:18px">'+t.name+'</b><div>'+tstat(t)+'</div></div></div><div class="mid bubs" style="justify-content:flex-end">'+msgs+'</div><div class="bot" style="gap:10px">'+(t.sug.length?'<div class="lbl">Tap to reply</div>':'')+sug+(t.team?'':'<button class="btn btn-text" data-act="closethread">Close this conversation</button>')+'</div></div>';
}
var SCREENS={appstore:scAppstore,o1:function(){return scObs('o1');},o2:function(){return scObs('o2');},o3:function(){return scObs('o3');},o4:function(){return scObs('o4');},o5:function(){return scObs('o5');},o6:function(){return scObs('o6');},o7:function(){return scObs('o7');},
 id:scId,q1:function(){return scQuiz(0);},q2:function(){return scQuiz(1);},card:scCard,payout:scPayout,perm:scPerm,board:scBoard,prizes:scPrizes,contact:scContact,cardsent:scCardsent,time:scTime,summary:scSummary,know:scKnow,nudge:scNudge,queue:scQueue,prac:scPrac,oj:function(){return scObs('oj');},find:scFind,there:scThere,look:scLook,say:scSay,reply:scReply,qr:scQr,claimwait:scClaimwait,claimed:scClaimed,
 leads:scLeads,lead:scLead,dask:function(){return scDemo('dask');},dshow:function(){return scDemo('dshow');},dworth:function(){return scDemo('dworth');},dplan:function(){return scDemo('dplan');},dclose:function(){return scDemo('dclose');},dsend:scDsend,followup:scFollowup,won:scWon,money:scMoney,inbox:scInbox,thread:scThread};

function render(){
 var hostEl=document.getElementById('host');hostEl.innerHTML=SCREENS[S.screen]();document.getElementById('phone').classList.toggle('dk',!!hostEl.querySelector('.scr.dark'));
 if(S.screen==='board')startFeed();else stopFeed();
 renderChaps();
}
function startFeed(){stopFeed();feedTimer=setInterval(function(){S.feed=(S.feed+1)%FEED.length;var t=document.getElementById('tick');if(t)t.innerHTML=feedLine();},3200);}
function stopFeed(){if(feedTimer){clearInterval(feedTimer);feedTimer=null;}}
function renderChaps(){
 var cur=chapterOf();
 var list='<ol class="chap">'+CHAPS.map(function(c,i){return '<li><button data-act="chap" data-arg="'+(i+1)+'" '+(cur===i+1?'aria-current="true"':'')+'><i>'+(i+1)+'</i>'+c+'</button></li>';}).join('')+'</ol>';
 document.getElementById('rail').innerHTML='<h1>Registry Scout</h1><p>One screen at a time. One button. Tap through it or jump to any step.</p>'+list+'<p class="note">Names, earnings, the leaderboard and plan prices are sample data. Screens marked Prototype stand in for things that happen on the customer\'s side.</p>';
 document.getElementById('sheet').innerHTML='<h2>Jump to a step</h2>'+list;
}
function jump(n){
 document.getElementById('sheetback').classList.remove('open');
 S.leads=[];S.threads=[];S.bi=0;S.plan=1;S.lead='marlow';S.session={mins:60,total:4,done:0,claims:0,cards:0,active:false};S.queue=freshQueue();S.who='owner';
 if(n===1){S.screen='appstore';S.install=0;}
 else if(n===2){S.screen='o1';}
 else if(n===3){S.screen='id';}
 else if(n===4){S.screen='board';S.tab='board';}
 else if(n===5){S.screen='time';S.tab='find';}
 else if(n===6){S.session.active=true;S.screen='know';}
 else if(n===7){seed();addMarlow(1);S.screen='leads';S.tab='leads';}
 else if(n===8){seed();addMarlow(2);S.screen='dask';}
 else if(n===9){seed();addMarlow(4);S.screen='won';S.tab='money';}
 else if(n===10){seed();addMarlow(2);S.screen='inbox';S.tab='inbox';}
 render();
}
function act(a,arg,el){
 switch(a){
  case 'chapters':document.getElementById('sheetback').classList.add('open');break;
  case 'closechapters':if(el===document.getElementById('sheetback'))document.getElementById('sheetback').classList.remove('open');break;
  case 'chap':jump(+arg);break;
  case 'install':S.install=1;S.prog=0;render();var t=setInterval(function(){S.prog+=10;if(S.prog>=100){clearInterval(t);S.install=2;}if(S.screen==='appstore')render();},130);break;
  case 'open':S.screen='o1';render();break;
  case 'go':S.screen=arg;render();break;
  case 'flowback':var g=groupOf(S.screen),arr=GROUPS[g],i=arr.indexOf(S.screen);S.screen=i>0?arr[i-1]:(GBACK[g]||arr[0]);if(S.screen==='find')S.tab='find';render();break;
  case 'answer':var p=arg.split(','),qi=+p[0],ai=+p[1];if(ai===QUIZ[qi].ok){S.screen=qi===0?'q2':'prac';render();}else{toast('Not quite. '+QUIZ[qi].fix);}break;
  case 'tab':S.tab=arg;S.screen=(arg==='find'&&!S.session.active)?'time':arg;render();break;
  case 'skip':S.bi=(S.bi+1)%BIZ.length;render();break;
  case 'tocontact':var tb=biz();S.contact=arg==='desk'?{name:'',phone:'',email:'',role:'Owner',ok:false,fd:true}:{name:tb.owner,phone:tb.phone,email:'',role:'Owner',ok:false,fd:false};S.screen='contact';render();break;
  case 'who':S.who=arg;render();break;
  case 'takeq':var qq=S.queue.shift();if(qq){S.leads.unshift({id:qq.id,name:qq.name,stage:1,when:'',closer:'me',plan:1,inbound:1,contact:{name:qq.who,role:'Owner',phone:qq.phone},touch:{text:'Never',email:'Never',meet:'None yet'},open:{kind:'email',n:0,ago:''}});S.threads.unshift({id:qq.id,name:qq.name,unread:0,owe:false,since:'',msgs:[['me','Hi '+qq.who+', thanks for registering '+qq.name+'. Want a free 15 minute look at how AI sees it? Pick a time in the next 3 days.','Sent by the app for you']],auto:'Call them now. The first 15 minutes matter.',sug:[]});S.lead=qq.id;S.screen='lead';render();toast('Yours. Call '+qq.who+' now.');}break;
  case 'passq':S.queue.shift();S.screen='leads';render();break;
  case 'role':S.contact.role=arg;render();break;
  case 'sendcard':var cb=biz();addCardLead(cb,S.contact);S.lead=cb.id;S.session.cards++;S.session.done++;S.screen='cardsent';render();break;
  case 'settime':S.time=+arg;render();break;
  case 'starttime':S.session={mins:S.time,total:Math.max(1,Math.round(S.time/60*4)),done:0,claims:0,cards:0,active:true};S.bi=0;S.screen='find';S.tab='find';render();break;
  case 'done':S.screen='summary';render();break;
  case 'endsession':S.session={mins:S.time,total:Math.max(1,Math.round(S.time/60*4)),done:0,claims:0,cards:0,active:false};S.tab=arg;S.screen=arg;render();break;
  case 'nextbiz':S.bi=(S.bi+1)%BIZ.length;S.screen='find';S.tab='find';render();break;
  case 'protoclaim':var pc=lead(S.lead);claimLead(bizOf(pc.id)||biz(),pc.contact);pc.stage=1;pc.open={kind:'text',n:2,ago:'just now'};render();toast('They claimed. The app is texting them to book a meeting.');break;
  case 'nextdoor':S.bi=1;S.screen='find';S.tab='find';render();break;
  case 'claimed':claimLead(biz(),{name:biz().owner,role:'Owner',phone:biz().phone});S.session.claims++;S.session.done++;S.screen='claimed';render();break;
  case 'lead':S.lead=arg;S.screen='lead';render();break;
  case 'closer':var l=lead(S.lead);if(l){l.closer=arg;}render();break;
  case 'protobook':var pl=lead(S.lead);pl.stage=2;pl.when='Thu 10:30 am';pl.meetIn=2;pl.tBook=2;var pt=thread(pl.id);if(pt&&!pt.booked){pt.booked=1;pt.msgs.push(['them','Thursday at 10:30 works.']);pt.msgs.push(['me','Booked. You will get a reminder the day before.','Sent by the app for you']);pt.auto='Reminder text Wed 4:00 pm';}ensureTeam(pl);render();toast('They booked Thu 10:30 am, 2 days out. A team chat opened for this lead.');break;
  case 'teamclose':var tl=lead(S.lead);tl.stage=4;tl.tClose=6;render();break;
  case 'pickplan':S.plan=+arg;S.screen='dclose';render();break;
  case 'paid':var pd=lead(S.lead);if(!pd){addMarlow(4);pd=lead('marlow');S.lead='marlow';}pd.stage=4;pd.plan=S.plan;if(!pd.closer)pd.closer='me';pd.tClose=5;if(pd.tBook==null)pd.tBook=2;S.screen='won';render();break;
  case 'toast':toast(arg);break;
  case 'thread':S.thread=arg;thread(arg).unread=0;S.screen='thread';render();break;
  case 'sendreply':var th=thread(S.thread);th.msgs.push(['me',th.sug[+arg],th.team?'Team channel':'Sent from your app number']);th.sug=[];th.owe=false;th.auto=th.team?'':'Next follow-up: tomorrow 9:00 am';render();break;
  case 'closethread':var ct=thread(S.thread);if(ct)ct.done=true;S.screen='inbox';render();break;
  case 'teamchat':var tcl=lead(S.lead);ensureTeam(tcl);S.thread='team-'+tcl.id;thread(S.thread).unread=0;S.screen='thread';S.tab='inbox';render();break;
  case 'hotlead':S.lead=arg;S.screen='nudge';S.tab='leads';render();break;
  case 'sendnudge':var nl=lead(S.lead),no=nudgeOpts(nl)[+arg],nt=thread(nl.id);if(nt){nt.msgs.push(['me',no[2],'Sent by the app for you']);nt.owe=false;}if(nl.touch)nl.touch.text='Just now';S.screen='lead';render();toast('Sent. You will see when they click or reply.');break;
 }
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;act(el.getAttribute('data-act'),el.getAttribute('data-arg'),el);});
document.addEventListener('input',function(e){
 var el=e.target,k=el.getAttribute('data-in');if(!k)return;
 if(k==='cname'||k==='cphone'||k==='cemail'){S.contact[k==='cname'?'name':(k==='cphone'?'phone':'email')]=el.value;syncSend();}
 else if(k==='cok'){S.contact.ok=el.checked;syncSend();}
 else if(k==='value'){S.value=+el.value;document.getElementById('o-value').textContent=usd(S.value);document.getElementById('o-win').textContent=usd(winMonthly());}
 else if(k==='weekly'){S.weekly=+el.value;document.getElementById('o-weekly').textContent=S.weekly+' hr';document.getElementById('o-proj').textContent=usd(proj())+' a month';}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('sheetback').classList.remove('open');});
render();
})();
</script>
